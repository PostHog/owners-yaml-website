name: Bump owners-yaml pin

on:
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:

permissions:
    actions: write
    contents: write
    pull-requests: write

concurrency:
    group: bump-owners-yaml
    cancel-in-progress: false

jobs:
    bump:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Open a PR when PyPI has a newer owners-yaml
              run: .github/scripts/bump-owners-yaml.sh
              env:
                  GH_TOKEN: ${{ github.token }}

            # GitHub disables a scheduled workflow after 60 days without commits; enabling it again restarts that clock.
            - name: Keep the schedule alive
              run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bump-owners-yaml.yml/enable"
              env:
                  GH_TOKEN: ${{ github.token }}
